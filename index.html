<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Império de Papel</title>
  <style>
    @font-face { font-family: 'IM Fell English'; src: url('/fonts/IMFellEnglish-Regular.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'IM Fell English'; font-style: italic; src: url('/fonts/IMFellEnglish-Italic.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'Libre Caslon Text'; font-weight: 400 700; src: url('/fonts/LibreCaslonText.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'Libre Caslon Text'; font-style: italic; font-weight: 400 700; src: url('/fonts/LibreCaslonText-Italic.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'UnifrakturMaguntia'; src: url('/fonts/UnifrakturMaguntia.ttf') format('truetype'); font-display: block; }
    :root { --paper: #f1e6cf; --ink: #2b1d10; --brass-hi: #d9b45a; --brass: #a87d2c; --brass-lo: #6b4a16; --leather: #2b2118;
      --title: 'IM Fell English', Georgia, serif; --text: 'Libre Caslon Text', Georgia, serif;
      --rivets: radial-gradient(circle at 8px 8px, var(--brass-hi) 0 2px, var(--brass-lo) 2.5px, transparent 3px),
        radial-gradient(circle at calc(100% - 8px) 8px, var(--brass-hi) 0 2px, var(--brass-lo) 2.5px, transparent 3px),
        radial-gradient(circle at 8px calc(100% - 8px), var(--brass-hi) 0 2px, var(--brass-lo) 2.5px, transparent 3px),
        radial-gradient(circle at calc(100% - 8px) calc(100% - 8px), var(--brass-hi) 0 2px, var(--brass-lo) 2.5px, transparent 3px);
      --grain: repeating-linear-gradient(37deg, #6b553608 0 1px, transparent 1px 5px), repeating-linear-gradient(-53deg, #6b553606 0 1px, transparent 1px 7px);
      --brass-frame: inset 0 0 0 1px var(--brass-hi), inset 0 0 0 3px var(--brass-lo); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9dcbc; color: #3e2a18; font: 14px var(--text); }
    button, input, select { font-family: inherit; }
    .ico { width: 1.1em; height: 1.1em; vertical-align: -0.18em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    #hud { position: fixed; z-index: 2; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; background: #efe3c4ee; padding: 10px 12px; border-radius: 6px; border: 1px solid #6b5536; }
    #hud .row { display: flex; gap: 6px; align-items: center; }
    #hud input { width: 120px; background: #f7eed8; color: inherit; border: 1px solid #6b5536; border-radius: 4px; padding: 4px 6px; }
    #hud button { background: #6b5536; color: #f1e6cf; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    #hud button.ghost { background: #9a8466; }
    #progress { height: 4px; background: #d8c8a6; border-radius: 2px; overflow: hidden; }
    #progress > div { height: 100%; width: 0; background: #8a2a20; transition: width .15s; }
    #info { display: none; opacity: .85; }
    #info.on { display: block; }
    #error { color: #8a2a20; display: none; max-width: 280px; }
    #topbar { position: fixed; z-index: 3; top: 0; left: 0; right: 0; white-space: nowrap; display: none; gap: 14px; align-items: center; justify-content: space-between;
      background: var(--leather); color: #f1e6cf; padding: 5px 12px; border-bottom: 2px solid var(--brass); font-variant-numeric: tabular-nums; }
    #topbar #res { display: flex; gap: 10px; align-items: center; }
    #topbar .mid, #topbar .right { display: flex; gap: 10px; align-items: center; }
    #topbar .res { cursor: pointer; display: inline-flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
    #topbar .res small { font-size: 11px; opacity: .85; }
    #topbar .res small.neg { color: #ff9a8a; opacity: 1; }
    #topbar .res small.pos { color: #a8d88a; }
    #topbar .sep { width: 1px; align-self: stretch; background: #6b5536; margin: 2px 2px; }
    #topbar .mid .res { flex-direction: row; gap: 4px; }
    body.playing #hud { top: 52px; }
    body.playing #hud .row:nth-child(2), body.playing #hud #link, body.playing #hud #progress, body.playing #hud #stage { display: none; }
    body.playing #panel { top: 92px; max-height: calc(100vh - 120px); }
    #alerts { position: fixed; z-index: 3; top: 46px; left: 50%; transform: translateX(-50%); display: none; gap: 6px; }
    #alerts .grp { background: #2b2118e6; color: #f1e6cf; border: 1px solid #6b5536; border-radius: 12px; padding: 2px 9px; font-size: 12px; cursor: pointer; position: relative; }
    #alerts .grp.red { border-color: #c0392b; background: #4a1a14e6; }
    #alerts .list { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px; background: #f1e6cf; color: #2b1d10; border: 1px solid #6b5536; border-radius: 6px; padding: 6px; min-width: 300px; white-space: normal; box-shadow: 0 6px 18px #0006; }
    #alerts .grp:hover .list { display: block; }
    #alerts .item { padding: 4px 4px; border-top: 1px solid #d8c8a6; cursor: pointer; }
    #alerts .item:first-child { border-top: 0; }
    #alerts .item small { display: block; color: #6b5536; }
    #panel .lhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    #panel .lrow { display: flex; justify-content: space-between; font-size: 12px; padding: 1px 0; }
    #panel .neg { color: #8a2a20; } #panel .pos { color: #3f6a2a; }
    #panel svg.spark { display: block; margin: 2px 0 4px; }
    #topbar #date { font-weight: 600; min-width: 140px; text-align: center; }
    #speeds button { background: #3d2f22; color: #f1e6cf; border: 1px solid #6b5536; padding: 3px 8px; margin-left: 2px; border-radius: 4px; cursor: pointer; }
    #speeds button.on { background: #b08a4a; color: #1d150e; }
    #panel { position: fixed; z-index: 3; top: 70px; right: 12px; width: 320px; max-height: calc(100vh - 100px); overflow: auto; display: none;
      background: var(--rivets), var(--grain), var(--paper); color: var(--ink); border: 2px solid var(--brass); border-radius: 8px; padding: 14px 16px; box-shadow: var(--brass-frame), 0 6px 24px #0006; font-size: 13px; }
    #panel h2 { margin: 0 0 2px; font: 24px var(--title); }
    #panel h3 { margin: 12px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #6b5536; }
    #panel .sub { color: #6b5536; margin-bottom: 8px; }
    #panel .x { position: absolute; top: 8px; right: 8px; background: none; border: 0; font-size: 16px; cursor: pointer; color: #6b5536; }
    #panel .fac { display: grid; grid-template-columns: 82px 1fr 36px; gap: 6px; align-items: center; margin: 3px 0; }
    #panel .fac i { height: 7px; background: #d8c8a6; border-radius: 4px; overflow: hidden; }
    #panel .fac b { display: block; height: 100%; background: #8a6a3a; }
    #panel .fac em { font-style: normal; text-align: right; color: #6b5536; }
    #panel .slot { border-top: 1px solid #d8c8a6; padding: 6px 0; }
    #panel .slot.empty b { color: #8a7a5a; }
    #panel .act { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    #panel button:not(.x) { background: #6b5536; color: #f1e6cf; border: 0; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    #panel button:disabled { background: #b9a888; cursor: not-allowed; }
    #panel button.big { font-size: 15px; padding: 8px 14px; margin-top: 6px; background: #8a2a20; }
    #panel .why { display: block; color: #8a2a20; font-size: 11px; width: 100%; }
    #panel h3.sec { cursor: pointer; user-select: none; }
    #panel .secb.closed { display: none; }
    #panel small.nope { display: block; width: 100%; font-size: 11px; color: #8a7a5a; margin-top: -1px; }
    #panel button:not(.x) small { display: block; font-size: 10px; opacity: .85; }
    #steps { position: fixed; z-index: 2; left: 12px; bottom: 34px; width: 300px; background: var(--rivets), var(--grain), var(--paper); color: var(--ink); border: 2px solid var(--brass); border-radius: 8px; padding: 12px 14px; box-shadow: var(--brass-frame), 0 4px 16px #0005; font-size: 13px; display: none; }
    #steps h4 { margin: 0 0 6px; font: italic 18px var(--title); }
    #steps li { margin: 3px 0; } #steps li.done { color: #6b8a4a; text-decoration: line-through; }
    #steps button { margin-top: 6px; background: #9a8466; color: #f1e6cf; border: 0; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
    #panel small.fx { display: block; width: 100%; font-size: 11px; color: #6b5536; margin: -1px 0 3px; }
    #toasts { position: fixed; z-index: 3; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
    #toasts div { background: #2b2118e6; color: #f1e6cf; padding: 6px 12px; border-radius: 6px; border: 1px solid #6b5536; }
    #tip { position: fixed; z-index: 4; display: none; pointer-events: none; background: #2b2118e6; color: #f1e6cf; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    #hud select { background: #f7eed8; color: inherit; border: 1px solid #6b5536; border-radius: 4px; padding: 3px 4px; }
    #stab.low b { color: #ff9a8a; }
    #headline { position: fixed; z-index: 4; top: 84px; left: 50%; transform: translateX(-50%); display: none; min-width: 420px; max-width: 70vw; text-align: center;
      background: #f4ecd6; color: #1d150e; border: 3px double #3e2a18; padding: 6px 18px 10px; box-shadow: 0 6px 24px #0007; pointer-events: none; }
    #headline .mast { font: italic 13px var(--title); border-bottom: 1px solid #3e2a18; padding-bottom: 3px; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 18px; }
    #headline .title { font: 28px var(--title); letter-spacing: .02em; }
    #hl-paper { font: 16px 'UnifrakturMaguntia', var(--title); font-style: normal; }
    #ledger, #laws, #journal, #letters, #nations { background: #3d2f22; color: #f1e6cf; border: 1px solid #6b5536; padding: 3px 10px; border-radius: 4px; cursor: pointer; }
    #panel .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; border: 1px solid #3e2a18; margin-right: 5px; vertical-align: -1px; }
    #panel a.go { color: inherit; cursor: pointer; text-decoration: underline dotted; }
    #end { position: fixed; z-index: 5; inset: 0; display: none; align-items: center; justify-content: center; background: #2b211888; }
    #end > div { background: var(--rivets), var(--grain), var(--paper); border: 2px solid var(--brass); box-shadow: var(--brass-frame); border-radius: 8px; padding: 22px 30px; text-align: center; min-width: 280px; }
    #end h1 { margin: 0 0 6px; font: 40px var(--title); }
    #end p { margin: 4px 0 14px; color: #6b5536; }
    #end button { background: #6b5536; color: #f1e6cf; border: 0; border-radius: 4px; padding: 7px 14px; margin: 0 4px; cursor: pointer; font: 14px var(--text); }
    @media (max-width: 1500px) { #topbar .lbl, #topbar .res small { display: none; } }
    #help { position: fixed; z-index: 2; bottom: 12px; left: 12px; opacity: .75; font-size: 12px; background: #efe3c4cc; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <div id="hud">
    <div class="row">
      <label for="seed">Semente</label>
      <input id="seed" inputmode="numeric" />
      <button id="gen">Gerar</button>
      <button id="link" class="ghost">Copiar link</button>
    </div>
    <div class="row">
      <label for="difficulty">Rivais</label>
      <select id="difficulty"><option value="easy">Fácil</option><option value="normal" selected>Normal</option><option value="hard">Difícil</option></select>
    </div>
    <div id="stage"></div>
    <div id="progress"><div></div></div>
    <div id="info"></div>
    <div id="error"></div>
  </div>
  <div id="panel"></div>
  <div id="toasts"></div>
  <div id="tip"></div>
  <div id="headline"><div class="mast"><span id="hl-paper"></span><span id="hl-date"></span></div><div class="title" id="hl-title"></div></div>
  <div id="end"><div><h1 id="end-title"></h1><p id="end-text"></p><button id="end-stay">Continuar olhando</button><button id="end-new">Novo mundo</button></div></div>
  <div id="topbar">
    <span id="res"></span>
    <span class="mid">
      <span class="res" title="Batalhões / teto das guarnições"><span id="troops-ico"></span> <b id="troops">0/0</b></span>
      <span class="res" id="stab" title="Estabilidade média das suas províncias"><b>–</b></span>
    </span>
    <span class="right">
    <button id="ledger" title="Contas: de onde vem e para onde vai cada recurso"><span class="lbl">Contas</span></button>
    <button id="nations" title="Nações do mapa: relação, acordos e guerra"><span class="lbl">Nações</span></button>
    <button id="letters" class="mail" title="Propostas das outras nações"><span class="lbl">Cartas</span> (0)</button>
    <button id="laws" title="Leis de emergência"><span class="lbl">Leis</span> (0)</button>
    <button id="journal" title="Últimas manchetes"><span class="lbl">Jornal</span></button>
    <span id="date"></span>
    <span id="speeds">
      <button data-speed="0" title="Pausa (espaço)"></button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button>
    </span>
    </span>
  </div>
  <div id="alerts"></div>
  <div id="steps"><h4>Primeiros passos</h4><ol id="steps-list"></ol><button id="steps-skip">Pular dicas</button></div>
  <div id="help">arrastar (botão direito ou do meio) / WASD: mover · roda: zoom · M: continente · espaço: pausa · clique / caixa: selecionar tropas · clique direito: mandar · Shift+1–9: salvar grupo · 1–9: chamar · Esc: soltar</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
