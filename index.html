<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mundo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; color: #e8e6e1; font: 14px system-ui, sans-serif; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; z-index: 2; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; background: #14171ccc; padding: 10px 12px; border-radius: 8px; }
    #hud .row { display: flex; gap: 6px; align-items: center; }
    #hud input { width: 120px; background: #20242b; color: inherit; border: 1px solid #3a404a; border-radius: 4px; padding: 4px 6px; }
    #hud button { background: #2f6f4f; color: #fff; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    #hud button.ghost { background: #2a2f37; }
    #hud select { background: #20242b; color: inherit; border: 1px solid #3a404a; border-radius: 4px; padding: 4px; }
    #progress { height: 4px; background: #2a2f37; border-radius: 2px; overflow: hidden; }
    #progress > div { height: 100%; width: 0; background: #5fb37f; transition: width .15s; }
    #info { font-variant-numeric: tabular-nums; opacity: .85; }
    #error { color: #ff8a80; display: none; max-width: 280px; }
    #strategic { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; cursor: crosshair; }
    #topbar { position: fixed; z-index: 2; top: 12px; right: 12px; white-space: nowrap; display: none; gap: 18px; align-items: center; background: #2b2118e6; color: #f1e6cf; padding: 8px 16px; border-radius: 8px; border: 1px solid #6b5536; font-variant-numeric: tabular-nums; }
    #topbar small { opacity: .75; }
    #topbar #date { font-weight: 600; min-width: 140px; text-align: center; }
    #speeds button { background: #3d2f22; color: #f1e6cf; border: 1px solid #6b5536; padding: 3px 8px; margin-left: 2px; border-radius: 4px; cursor: pointer; }
    #speeds button.on { background: #b08a4a; color: #1d150e; }
    #panel { position: fixed; z-index: 3; top: 70px; right: 12px; width: 320px; max-height: calc(100vh - 100px); overflow: auto; display: none;
      background: #f1e6cf; color: #2b1d10; border: 2px solid #6b5536; border-radius: 8px; padding: 12px 14px; box-shadow: 0 6px 24px #0006; font-size: 13px; }
    #panel h2 { margin: 0 0 2px; font: italic 22px Georgia, serif; }
    #panel h3 { margin: 12px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #6b5536; }
    #panel .sub { color: #6b5536; margin-bottom: 8px; }
    #panel .x { position: absolute; top: 8px; right: 8px; background: none; border: 0; font-size: 16px; cursor: pointer; color: #6b5536; }
    #panel .fac { display: grid; grid-template-columns: 82px 1fr 36px; gap: 6px; align-items: center; margin: 3px 0; }
    #panel .fac i { height: 7px; background: #d8c8a6; border-radius: 4px; overflow: hidden; }
    #panel .fac b { display: block; height: 100%; background: #8a6a3a; }
    #panel .fac em { font-style: normal; text-align: right; color: #6b5536; }
    #panel .slot { border-top: 1px solid #d8c8a6; padding: 6px 0; }
    #panel .slot.empty b { color: #8a7a5a; }
    #panel .act { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    #panel button:not(.x) { background: #6b5536; color: #f1e6cf; border: 0; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    #panel button:disabled { background: #b9a888; cursor: not-allowed; }
    #panel button.big { font-size: 15px; padding: 8px 14px; margin-top: 6px; background: #8a2a20; }
    #panel .why { display: block; color: #8a2a20; font-size: 11px; width: 100%; }
    #toasts { position: fixed; z-index: 3; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
    #toasts div { background: #2b2118e6; color: #f1e6cf; padding: 6px 12px; border-radius: 6px; border: 1px solid #6b5536; }
    #tip { position: fixed; z-index: 4; display: none; pointer-events: none; background: #2b2118e6; color: #f1e6cf; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    #labels div { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 3px; background: #2b2118cc; color: #f1e6cf; white-space: nowrap; }
    #labels .mine { background: #8a2a20e6; }
    #labels .battle { font-size: 16px; text-align: center; }
    #labels .battle i { display: block; width: 46px; height: 4px; margin-top: 2px; background: #0008; }
    #labels .battle b { display: block; height: 100%; background: #a8a8a0; }
    #labels .battle b.mine { background: #e0503c; }
    #help { position: fixed; z-index: 2; bottom: 12px; left: 12px; opacity: .6; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <div class="row">
      <label for="seed">Semente</label>
      <input id="seed" inputmode="numeric" />
      <button id="gen">Gerar</button>
      <button id="link" class="ghost">Copiar link</button>
      <select id="quality" title="Qualidade gráfica"><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select>
    </div>
    <div id="stage"></div>
    <div id="progress"><div></div></div>
    <div id="info"></div>
    <div id="error"></div>
  </div>
  <div id="labels"></div>
  <canvas id="strategic"></canvas>
  <div id="panel"></div>
  <div id="toasts"></div>
  <div id="tip"></div>
  <div id="topbar">
    <span class="res" title="Ouro">🪙 <b id="r-gold">0</b> <small id="i-gold"></small></span>
    <span class="res" title="Madeira">🪵 <b id="r-wood">0</b> <small id="i-wood"></small></span>
    <span class="res" title="Pedra">🪨 <b id="r-stone">0</b> <small id="i-stone"></small></span>
    <span id="date"></span>
    <span id="speeds">
      <button data-speed="0" title="Pausa (espaço)">⏸</button><button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button>
    </span>
  </div>
  <div id="help">WASD / arrastar (botão direito): mover · Q/E: girar · roda: zoom · M: mapa · espaço: pausa</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
